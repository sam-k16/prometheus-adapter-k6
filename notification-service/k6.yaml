---
apiVersion: batch/v1
kind: Job
metadata:
  name: notification-service-capacity-test
  namespace: order-app

spec:
  backoffLimit: 0

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: k6
          image: grafana/k6:latest

          args:
            - run
            - /scripts/load-test.js

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: script
              mountPath: /scripts

      volumes:
        - name: script
          configMap:
            name: notification-service-capacity-test-script
