apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: order-app
  labels:
    app: order-service
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service
    spec:
      securityContext:
        runAsNonRoot: true

      containers:
        - name: order-service
          image: asia-south1-docker.pkg.dev/iconic-being-499605-m3/order-app/order-service:v4

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000


          env:
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:8001"

            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:8002"

            - name: OTEL_SERVICE_NAME
              value: "order-service"

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"

            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"

            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=order-app,service.version=1.0"

            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"

            - name: OTEL_TRACES_EXPORTER
              value: "otlp"

            # Keep Prometheus for metrics
            - name: OTEL_METRICS_EXPORTER
              value: "none"

            # We'll enable this with Loki later
            - name: OTEL_LOGS_EXPORTER
              value: "none"

          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
