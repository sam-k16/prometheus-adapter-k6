deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    retention_period: 168h
    allow_structured_metadata: true

  compactor:
    retention_enabled: true

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    storageClass: standard-rwo
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Disable SimpleScalable mode
backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

# Disable gateway
gateway:
  enabled: false

# Disable MinIO (filesystem storage)
minio:
  enabled: false

# Disable caches
chunksCache:
  enabled: false

resultsCache:
  enabled: false

# Disable canary
lokiCanary:
  enabled: false

# Disable test pod
test:
  enabled: false

# We are using OpenTelemetry Collector instead
promtail:
  enabled: false

# Enable ServiceMonitor for Prometheus
monitoring:
  serviceMonitor:
    enabled: true
  dashboards:
    enabled: true