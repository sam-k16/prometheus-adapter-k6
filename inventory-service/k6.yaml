apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-service-capacity-test-script
  namespace: order-app
data:
  load-test.js: |
    import http from 'k6/http';
    import { check } from 'k6';

    export const options = {
      noConnectionReuse: true,
      scenarios: {
        capacity_test: {
          executor: 'ramping-arrival-rate',

          startRate: 5,
          timeUnit: '1s',

          preAllocatedVUs: 100,
          maxVUs: 300,

          stages: [
            { target: 40, duration: '2m' },
            { target: 60, duration: '2m' },
            { target: 80, duration: '2m' },
            { target: 100, duration: '2m' },
            { target: 120, duration: '2m' },
            { target: 140, duration: '5m' },
          ],
        },
      },

      thresholds: {
        // Keep permissive during capacity discovery.
        // We want to observe where degradation starts rather
        // than aborting the experiment early.
        http_req_failed: ['rate<1.0'],
      },
    };

    export default function () {
      const response = http.put(
        'http://inventory-service.order-app.svc:8001/inventory/reduce',
        JSON.stringify({
          product_id: 'PROD-001',
          quantity: 1,
        }),
        {
          headers: {
            'Content-Type': 'application/json',
          },
        }
      );

      check(response, {
        'status is 200': (r) => r.status === 200,
      });
    }

---
apiVersion: batch/v1
kind: Job
metadata:
  name: inventory-service-capacity-test
  namespace: order-app
spec:
  backoffLimit: 0

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: k6
          image: grafana/k6:latest

          args:
            - run
            - /scripts/load-test.js

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: script
              mountPath: /scripts

      volumes:
        - name: script
          configMap:
            name: inventory-service-capacity-test-script
