apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: order-app
  labels:
    app: inventory-service
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: inventory-service

  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      securityContext:
        runAsNonRoot: true

      containers:
        - name: inventory-service
          image: asia-south1-docker.pkg.dev/iconic-being-499605-m3/order-app/inventory-service:v8

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8001
              protocol: TCP

          env:
           - name: OTEL_SERVICE_NAME
             value: inventory-service

           - name: OTEL_EXPORTER_OTLP_ENDPOINT
             value: http://otel-collector:4317

           - name: OTEL_EXPORTER_OTLP_PROTOCOL
             value: grpc

           - name: OTEL_RESOURCE_ATTRIBUTES
             value: service.namespace=order-app,service.version=1.0

           - name: OTEL_PROPAGATORS
             value: tracecontext,baggage

           - name: OTEL_TRACES_EXPORTER
             value: otlp

           - name: OTEL_METRICS_EXPORTER
             value: none

           - name: OTEL_LOGS_EXPORTER
             value: none

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL